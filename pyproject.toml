[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "door-camera"
version = "0.1.0"
description = "Peephole camera motion detector and recorder"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "numpy",
]

[tool.setuptools.packages.find]
where = ["soft"]
exclude = ["cad*"]
